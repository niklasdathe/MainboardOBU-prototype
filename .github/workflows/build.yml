name: ESP-IDF build
on:
  push:
  pull_request:

jobs:
  validate-hardware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate hardware profiles
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python scripts/check_pin_plan.py config/hardware/prototype-expansion-base.yaml
          python scripts/check_pin_plan.py config/hardware/round-display-carrier.yaml

  build-c5:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Verify ESP-IDF 6.1
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py --version
      - name: Build ESP32-C5 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C firmware/c5 set-target esp32c5
          idf.py -C firmware/c5 build

  build-s3:
    runs-on: ubuntu-latest
    container: espressif/idf:release-v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Verify ESP-IDF 6.1
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py --version
      - name: Build ESP32-S3 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C firmware/s3 set-target esp32s3
          idf.py -C firmware/s3 build
